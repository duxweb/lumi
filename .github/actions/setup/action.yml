name: Install workspace
description: Set up the pinned Node and pnpm versions and install locked dependencies.
inputs:
  registry-url:
    description: Optional package registry used by the release job.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22.12.x
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}

    - run: pnpm install --frozen-lockfile
      shell: bash
