name: Install workspace
description: Set up the pinned Node and pnpm versions and install locked dependencies.
inputs:
  node-version:
    description: Node version used for this job.
    required: false
    default: 22.12.x
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
