name: Deploy Admin Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.x
          cache: pnpm

      - uses: actions/configure-pages@v5

      - run: pnpm install --frozen-lockfile

      - name: Build admin
        run: pnpm --dir apps/admin build
        env:
          LUMI_ADMIN_BASE: /${{ github.event.repository.name }}/
          VITE_LUMI_ADMIN_API_URL: ${{ vars.LUMI_ADMIN_API_URL }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/admin/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
