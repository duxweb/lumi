name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency: release

jobs:
  # Publishing a stable tag requires the same complete checks as main and PRs.
  verification:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verification
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          node-version: 22.22.1

      # pnpm 9 delegates registry uploads to npm. OIDC needs npm >=11.5.1.
      - name: Install trusted publishing client
        run: pnpm add --global npm@11.21.2

      - name: Validate release tag and main ancestry
        run: |
          pnpm verify:release-version
          git merge-base --is-ancestor HEAD origin/main

      # Changesets packs the package directories, so dist must exist; this
      # is a build only, verification already passed in the job above.
      - name: Build packages
        run: pnpm build:packages

      - name: Publish packages through Changesets
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_npm_path: ${{ env.PNPM_HOME }}/npm
          NPM_CONFIG_PROVENANCE: true

      - name: Create GitHub release
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
