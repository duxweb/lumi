name: CI & Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency: release

jobs:
  # The same parallel checks run for main and pull requests. A reusable workflow
  # succeeds only after every required job (including both E2E groups) passes.
  verification:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verification
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          registry-url: https://registry.npmjs.org

      # Changesets packs the package directories, so dist must exist; this
      # is a build only, verification already passed in the job above.
      - name: Build packages
        run: pnpm build:packages

      - uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          commit: 'chore: release'
          title: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
